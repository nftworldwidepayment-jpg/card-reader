<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Club GG Hand Reader</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="tools.css" />
</head>
<body>
  <header>
    <h1>♠ Club GG <span>Hand Reader</span></h1>
    <nav class="tool-nav">
      <a href="/" class="active">Painel</a>
      <a href="/calibrate">Calibrar</a>
      <a href="/teach">Ensinar cartas</a>
    </nav>
    <div id="status" class="status">a ligar...</div>
  </header>

  <main>
    <section class="table-card">
      <div class="board-row">
        <div class="board-cards" id="board"></div>
      </div>

      <div class="hand-banner" id="hand-banner">--</div>

      <div class="hole-row">
        <div class="hole-cards" id="hole"></div>
      </div>
    </section>

    <section class="seats-card">
      <h2>Jogadores</h2>
      <div class="seats" id="seats"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
